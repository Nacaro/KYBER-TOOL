name: Update Kyber live data

"on":
  workflow_dispatch:
  schedule:
    - cron: "2 * * * *"

permissions:
  contents: write

jobs:
  update-live-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kyber Tool
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get current live data
        run: python scripts/update_live_data.py

      - name: Save live data
        run: |
          git config user.name "kyber-tool-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live-data.json

          if git diff --cached --quiet; then
            echo "No live-data change."
          else
            git commit -m "Update Kyber live data"
            git push
          fi
